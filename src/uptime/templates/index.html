<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .6rem .4rem; border-bottom: 1px solid #d0d7de; }
    .up { color: #1a7f37; font-weight: 600; }
    .down { color: #cf222e; font-weight: 600; }
    .pending, .muted { color: #6e7781; }
  </style>
</head>
<body>
  <h1>Status</h1>
  <p class="muted">Refreshes every 10 seconds.</p>
  <div hx-get="/partials/monitors" hx-trigger="every 10s" hx-swap="innerHTML">
    {% include "_monitors.html" %}
  </div>
</body>
</html>
